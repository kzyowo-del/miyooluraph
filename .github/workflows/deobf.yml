name: Deobfuscate Luraph

on:
  push:
    paths:
      - 'input.lua'

jobs:
  deobf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download deobf
        run: |
          wget "https://github.com/kzyowo-del/miyooluraph/raw/main/deob_Luraph_v15Full.zip" -O deob.zip
          unzip deob.zip

      - name: Run deobfuscate
        run: |
          cd deobf
          python3 deobf/deob.py $GITHUB_WORKSPACE/input.lua -o $GITHUB_WORKSPACE/output_clean.lua 2>&1

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated
          path: output_clean.lua
